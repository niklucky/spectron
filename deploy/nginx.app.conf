server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Referrer-Policy "no-referrer" always;

    # Access is checked by the API before Nginx performs this internal redirect.
    location /_protected_files/ {
        internal;
        alias /data/files/;
        disable_symlinks on;
        add_header Cache-Control "private, no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location /api/files/ {
        # The API applies a streamed, configurable byte limit after authentication.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Public API uploads stream like /api/files/. Regex locations win over the
    # /api/ prefix below.
    location ~ ^/api/v1/(projects/[^/]+/files|issues/[^/]+/attachments)$ {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # MCP requests carry base64 file uploads; the API caps them at 5 MB.
    location = /api/mcp {
        client_max_body_size 6m;
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # OAuth discovery for MCP clients lives at the site root.
    location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource|openid-configuration) {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        client_max_body_size 3m;
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        # Overwrite client-supplied headers at the trusted reverse proxy.
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Sign-in and OAuth consent must never render inside another site's frame.
    location ~ ^/(login|register|forgot-password|reset-password|oauth/consent)/?$ {
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
