server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Referrer-Policy "no-referrer" always;

    # Access is checked by the API before Nginx performs this internal redirect.
    location /_protected_files/ {
        internal;
        alias /data/files/;
        disable_symlinks on;
        add_header Cache-Control "private, no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location /api/files/ {
        # The API applies a streamed, configurable byte limit after authentication.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        client_max_body_size 3m;
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        # Overwrite client-supplied headers at the trusted reverse proxy.
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
