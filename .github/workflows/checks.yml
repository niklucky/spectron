name: Checks

# The one definition of "is this good?", called by the pull request, main and
# release workflows so a tag cannot ship something a pull request would have
# rejected.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # A real Postgres on purpose: the suite creates and drops a database per
      # test file and runs the migrations into it, so the bugs worth catching
      # here are exactly the ones a mocked database hides. The port matches the
      # default the tests fall back to.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: spectron
          POSTGRES_USER: spectron
          POSTGRES_PASSWORD: spectron
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U spectron -d spectron"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run before the build even though `build` depends on it through turbo:
      # a type error then fails on its own line instead of inside a bundle.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://spectron:spectron@127.0.0.1:5442/spectron

      - name: Build
        run: pnpm build
