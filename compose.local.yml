name: spectron-local
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spectron
      POSTGRES_USER: spectron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spectron}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectron -d spectron"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped
volumes:
  postgres_data:
