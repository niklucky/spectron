# The marketing site at the apex, served by the `web` container on loopback.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __WEB_NAMES__;

    ssl_certificate /etc/letsencrypt/live/spectron.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spectron.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
