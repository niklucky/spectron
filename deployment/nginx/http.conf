# Port 80 for one hostname. Rendered by provision-server.sh.
#
# The ACME location is always live, so a certificate can be issued or renewed
# whether or not one exists yet. Everything else redirects to HTTPS once the
# certificate is in place, and answers 503 before that — a placeholder that
# cannot be mistaken for the site working.
server {
    listen 80;
    listen [::]:80;
    server_name __NAMES__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        __HTTP_RESPONSE__
    }
}
