# The application. One container behind this: the API process serves the
# bundle, answers /api and streams attachments, so there is a single upstream.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.spectron.dev;

    ssl_certificate /etc/letsencrypt/live/app.spectron.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.spectron.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Set here as well as by the API, so it covers every response including
    # the ones nginx generates itself.
    add_header Referrer-Policy "no-referrer" always;

    # Deliberately permissive: the real limit is FILES_MAX_BYTES, which the
    # API enforces on the authenticated, streamed upload. A limit here would
    # reject the upload with an nginx error page instead of the API's message,
    # and would have to be kept in step with that setting by hand.
    client_max_body_size 512M;

    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten, not appended: this is the trusted edge, so a header a
        # client sent cannot survive into TRUST_PROXY handling in the API.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Jira and Git syncs, exports and agent runs are all slower than the
        # 60s default.
        proxy_read_timeout 900s;
        # Uploads stream through to the API, which applies the byte limit as
        # it reads. Buffering here would spool the whole body to disk first.
        proxy_request_buffering off;
    }
}
