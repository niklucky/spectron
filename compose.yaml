services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spectron
      POSTGRES_USER: spectron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectron -d spectron"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command: ["pnpm", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS origin}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TRUST_PROXY: "true"
      PROJECT_LOGO_DNS: ${PROJECT_LOGO_DNS:-system}
      FILES_ROOT: /data/files
      FILE_DELIVERY: nginx
      FILES_MAX_BYTES: ${FILES_MAX_BYTES:-52428800}
    volumes:
      - ${FILES_HOST_PATH:-./data/files}:/data/files
    user: "${FILES_UID:-1000}:${FILES_GID:-1000}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  app:
    build:
      context: .
      args:
        APP: app
    volumes:
      - ${FILES_HOST_PATH:-./data/files}:/data/files:ro
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - api
  web:
    build:
      context: .
      args:
        APP: web
    ports:
      - "8081:80"
    restart: unless-stopped
volumes:
  postgres_data:
